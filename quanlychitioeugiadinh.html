<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Tài Chính Gia Đình</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-wallet text-2xl text-amber-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Family Finance Pro</h1>
                    <p class="text-xs text-indigo-200">Quản lý chi tiêu gia đình 4 thành viên chuyên nghiệp</p>
                </div>
            </div>
            <div class="mt-3 sm:mt-0 flex space-x-2">
                <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg border border-indigo-400 transition font-medium">
                    <i class="fa-solid fa-download mr-1"></i> Xuất dữ liệu
                </button>
                <button onclick="resetData()" class="bg-rose-600/80 hover:bg-rose-600 text-xs px-3 py-2 rounded-lg transition font-medium">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Đặt lại
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Overview Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tổng thu nhập</p>
                    <h3 id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">0 đ</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tổng chi tiêu</p>
                    <h3 id="totalExpense" class="text-2xl font-bold text-rose-600 mt-1">0 đ</h3>
                </div>
                <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Số dư hiện tại</p>
                    <h3 id="netBalance" class="text-2xl font-bold text-indigo-600 mt-1">0 đ</h3>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-vault"></i>
                </div>
            </div>
        </div>

        <!-- Dashboard Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Panel: Add Transaction Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-circle-plus text-indigo-600 mr-2"></i> Thêm Giao Dịch Mới
                </h2>
                <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Loại giao dịch</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="typeExpense" onclick="setType('chi')" class="py-2.5 text-xs font-semibold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 transition">Khoản Chi</button>
                            <button type="button" id="typeIncome" onclick="setType('thu')" class="py-2.5 text-xs font-semibold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 transition">Khoản Thu</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Số tiền (VNĐ)</label>
                            <input type="number" id="amount" required min="1000" step="1000" placeholder="VD: 500000" class="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Thành viên</label>
                            <select id="member" class="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="Bố">Bố</option>
                                <option value="Mẹ">Mẹ</option>
                                <option value="Con 1">Con 1</option>
                                <option value="Con 2">Con 2</option>
                                <option value="Cả nhà">Cả nhà chung</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Danh mục</label>
                        <select id="category" class="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Categories will dynamically change based on type -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ngày giao dịch</label>
                        <input type="date" id="date" required class="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi chú / Diễn giải chi tiết</label>
                        <textarea id="note" rows="2" placeholder="Nhập ghi chú chi tiết..." class="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm shadow-indigo-200">
                        Xác Nhận Lưu Giao Dịch
                    </button>
                </form>
            </div>

            <!-- Right Panel: Analytics & Transactions List -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Charts Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-3 text-center">Tỷ trọng Chi tiêu theo Danh mục</h3>
                        <div class="h-48 flex justify-center">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-3 text-center">Đóng góp Chi tiêu Thành viên</h3>
                        <div class="h-48 flex justify-center">
                            <canvas id="memberChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Transaction History & Filtering -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                        <h2 class="text-base font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-list-ul text-indigo-600 mr-2"></i> Lịch Sử Giao Dịch
                        </h2>
                        <!-- Filters -->
                        <div class="flex flex-wrap gap-2">
                            <select id="filterMember" onchange="renderTransactions()" class="text-xs px-3 py-2 rounded-xl border border-slate-200 bg-slate-50">
                                <option value="all">Tất cả thành viên</option>
                                <option value="Bố">Bố</option>
                                <option value="Mẹ">Mẹ</option>
                                <option value="Con 1">Con 1</option>
                                <option value="Con 2">Con 2</option>
                                <option value="Cả nhà">Cả nhà</option>
                            </select>
                            <select id="filterType" onchange="renderTransactions()" class="text-xs px-3 py-2 rounded-xl border border-slate-200 bg-slate-50">
                                <option value="all">Tất cả loại</option>
                                <option value="chi">Chỉ Chi</option>
                                <option value="thu">Chỉ Thu</option>
                            </select>
                            <button onclick="toggleAllNotes()" id="btnToggleAllNotes" class="text-xs px-3 py-2 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 font-medium transition">
                                <i class="fa-solid fa-eye-slash mr-1"></i> Ẩn/Hiện Ghi Chú
                            </button>
                        </div>
                    </div>

                    <!-- List Table/Cards -->
                    <div class="overflow-x-auto max-h-96 overflow-y-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase">
                                    <th class="py-3 px-3">Ngày / Thành viên</th>
                                    <th class="py-3 px-3">Danh mục</th>
                                    <th class="py-3 px-3">Ghi chú chi tiết</th>
                                    <th class="py-3 px-3 text-right">Số tiền</th>
                                    <th class="py-3 px-3 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="transactionTableBody" class="divide-y divide-slate-100 text-sm">
                                <!-- Dynamic rows inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- JavaScript Script Logic -->
    <script>
        // Cấu hình dữ liệu danh mục linh hoạt
        const categories = {
            chi: ["Ăn uống / Chợ", "Điện/Nước/Internet", "Học phí con cái", "Y tế / Sức khỏe", "Giải trí / Hiếu hỉ", "Mua sắm khác"],
            thu: ["Lương Bố", "Lương Mẹ", "Thưởng / Lợi nhuận", "Thu nhập khác"]
        };

        let currentType = 'chi';
        let transactions = JSON.parse(localStorage.getItem('family_finance_data')) || [
            { id: 1, type: 'thu', amount: 25000000, member: 'Bố', category: 'Lương Bố', date: '2026-09-01', note: 'Lương cơ bản tháng 9' },
            { id: 2, type: 'thu', amount: 18000000, member: 'Mẹ', category: 'Lương Mẹ', date: '2026-09-02', note: 'Lương chính thức tháng 9' },
            { id: 3, type: 'chi', amount: 5000000, member: 'Cả nhà', category: 'Ăn uống / Chợ', date: '2026-09-03', note: 'Mua sắm thực phẩm tuần đầu tháng cho cả gia đình 4 người' },
            { id: 4, type: 'chi', amount: 6000000, member: 'Con 1', category: 'Học phí con cái', date: '2026-09-05', note: 'Đóng học phí tiếng Anh và phí bán trú tháng 9' }
        ];

        let globalNotesVisible = true;
        let expenseChartInstance = null;
        let memberChartInstance = null;

        // Khởi tạo giao diện ứng dụng
        window.onload = function() {
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
            renderApp();
        };

        // Chuyển đổi loại thu / chi
        function setType(type) {
            currentType = type;
            const btnChi = document.getElementById('typeExpense');
            const btnThu = document.getElementById('typeIncome');

            if (type === 'chi') {
                btnChi.className = "py-2.5 text-xs font-semibold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 transition";
                btnThu.className = "py-2.5 text-xs font-semibold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 transition";
            } else {
                btnThu.className = "py-2.5 text-xs font-semibold rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 transition";
                btnChi.className = "py-2.5 text-xs font-semibold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 transition";
            }
            updateCategoryOptions();
        }

        function updateCategoryOptions() {
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });
        }

        // Thêm giao dịch mới
        function addTransaction(e) {
            e.preventDefault();
            const newTx = {
                id: Date.now(),
                type: currentType,
                amount: parseFloat(document.getElementById('amount').value),
                member: document.getElementById('member').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                note: document.getElementById('note').value.trim() || 'Không có ghi chú'
            };

            transactions.unshift(newTx);
            saveAndRefresh();
            document.getElementById('transactionForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            setType('chi');
        }

        // Xóa giao dịch
        function deleteTransaction(id) {
            if (confirm("Bạn có chắc chắn muốn xóa giao dịch này không?")) {
                transactions = transactions.filter(t => t.id !== id);
                saveAndRefresh();
            }
        }

        // Lưu vào LocalStorage và làm mới màn hình
        function saveAndRefresh() {
            localStorage.setItem('family_finance_data', JSON.stringify(transactions));
            renderApp();
        }

        function renderApp() {
            renderSummary();
            renderTransactions();
            renderCharts();
        }

        // Cập nhật thẻ tổng quan
        function renderSummary() {
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(t => {
                if (t.type === 'thu') totalIncome += t.amount;
                else totalExpense += t.amount;
            });

            const net = totalIncome - totalExpense;

            document.getElementById('totalIncome').textContent = formatCurrency(totalIncome);
            document.getElementById('totalExpense').textContent = formatCurrency(totalExpense);
            
            const netEl = document.getElementById('netBalance');
            netEl.textContent = formatCurrency(net);
            netEl.className = `text-2xl font-bold mt-1 ${net >= 0 ? 'text-indigo-600' : 'text-rose-600'}`;
        }

        // Render bảng danh sách lịch sử có bộ lọc
        function renderTransactions() {
            const filterMember = document.getElementById('filterMember').value;
            const filterType = document.getElementById('filterType').value;
            const tbody = document.getElementById('transactionTableBody');
            tbody.innerHTML = '';

            let filtered = transactions.filter(t => {
                let matchMember = (filterMember === 'all' || t.member === filterMember);
                let matchType = (filterType === 'all' || t.type === filterType);
                return matchMember && matchType;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs">Không tìm thấy giao dịch phù hợp.</td></tr>`;
                return;
            }

            filtered.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                const isIncome = t.type === 'thu';
                
                tr.innerHTML = `
                    <td class="py-3 px-3">
                        <div class="text-xs font-semibold text-slate-700">${t.date}</div>
                        <span class="inline-block mt-0.5 px-2 py-0.5 text-[10px] font-medium rounded-md bg-slate-100 text-slate-600">${t.member}</span>
                    </td>
                    <td class="py-3 px-3">
                        <span class="text-xs font-medium text-slate-800">${t.category}</span>
                    </td>
                    <td class="py-3 px-3 max-w-xs">
                        <div class="note-container text-xs text-slate-600 ${globalNotesVisible ? '' : 'hidden'}">
                            <p class="line-clamp-2 cursor-pointer hover:text-indigo-600" title="Nhấn để xem đầy đủ" onclick="alert('${t.note.replace(/'/g, "\\'")}')">${t.note}</p>
                        </div>
                        <span class="text-[11px] text-slate-400 italic ${globalNotesVisible ? 'hidden' : ''}">Đã ẩn ghi chú</span>
                    </td>
                    <td class="py-3 px-3 text-right font-semibold text-xs ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                        ${isIncome ? '+' : '-'}${formatCurrency(t.amount)}
                    </td>
                    <td class="py-3 px-3 text-center">
                        <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 p-1.5 transition rounded-lg hover:bg-rose-50" title="Xóa">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Ẩn / Hiện và thu gọn ghi chú nhanh toàn bảng
        function toggleAllNotes() {
            globalNotesVisible = !globalNotesVisible;
            const btn = document.getElementById('btnToggleAllNotes');
            if (globalNotesVisible) {
                btn.innerHTML = `<i class="fa-solid fa-eye-slash mr-1"></i> Ẩn/Hiện Ghi Chú`;
                btn.className = "text-xs px-3 py-2 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 font-medium transition";
            } else {
                btn.innerHTML = `<i class="fa-solid fa-eye mr-1"></i> Ẩn/Hiện Ghi Chú`;
                btn.className = "text-xs px-3 py-2 rounded-xl border border-slate-200 bg-slate-100 text-slate-700 font-medium transition";
            }
            renderTransactions();
        }

        // Vẽ biểu đồ phân tích (Chart.js)
        function renderCharts() {
            // 1. Biểu đồ chi theo danh mục
            let expenseByCategory = {};
            transactions.filter(t => t.type === 'chi').forEach(t => {
                expenseByCategory[t.category] = (expenseByCategory[t.category] || 0) + t.amount;
            });

            const expCtx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartInstance) expenseChartInstance.destroy();
            
            expenseChartInstance = new Chart(expCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseByCategory),
                    datasets: [{
                        data: Object.values(expenseByCategory),
                        backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'left', labels: { boxWidth: 10, font: { size: 10 } } } }
                }
            });

            // 2. Biểu đồ đóng góp chi tiêu theo thành viên
            let expenseByMember = { 'Bố': 0, 'Mẹ': 0, 'Con 1': 0, 'Con 2': 0, 'Cả nhà': 0 };
            transactions.filter(t => t.type === 'chi').forEach(t => {
                if (expenseByMember[t.member] !== undefined) {
                    expenseByMember[t.member] += t.amount;
                }
            });

            const memCtx = document.getElementById('memberChart').getContext('2d');
            if (memberChartInstance) memberChartInstance.destroy();

            memberChartInstance = new Chart(memCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(expenseByMember),
                    datasets: [{
                        label: 'Tổng chi (VNĐ)',
                        data: Object.values(expenseByMember),
                        backgroundColor: '#6366f1',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } }
                }
            });
        }

        // Định dạng tiền tệ VND
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        // Tiện ích xuất dữ liệu JSON dự phòng
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `family_finance_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Đặt lại dữ liệu mẫu
        function resetData() {
            if (confirm("Thao tác này sẽ khôi phục lại dữ liệu mẫu ban đầu?")) {
                localStorage.removeItem('family_finance_data');
                location.reload();
            }
        }
    </script>
</body>
</html>
